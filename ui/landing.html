<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Landing page of app_new.py. A 3D chessboard made from scratch with three.js.
     {{LOGO}} is replaced by the queen-and-king SVG from src/ui_parts.py. -->
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@200;300;400&family=Source+Sans+3:wght@400&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #111216; color: #f5f5f5; overflow: hidden;
    font-family: 'Source Sans 3', 'Segoe UI', Arial, sans-serif; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; }
  .top { text-align: center; padding-top: 20px; position: relative; z-index: 4; }
  .top svg { height: 74px; }
  .title { display: flex; align-items: center; justify-content: center; gap: 22px; margin-top: 14px;
    font-family: 'Josefin Sans', 'Montserrat', Arial, sans-serif; font-weight: 200; letter-spacing: .34em;
    font-size: clamp(20px, 3.3vw, 40px); text-transform: uppercase; padding-left: .34em; white-space: nowrap; }
  .title:before, .title:after { content: ""; width: clamp(26px, 8vw, 120px); height: 1px; background: rgba(245,245,245,.75); }
  .tag { transform: translateZ(0); margin-top: 12px; font-size: 12px; font-weight: 400; letter-spacing: .42em; color: #8a8a8a; text-transform: uppercase;
    font-family: 'Josefin Sans', Arial, sans-serif; padding-left: .42em; }
  .stage { position: relative; flex: 1; width: 100%; min-height: 280px; cursor: pointer; }
  .stage canvas { display: block; position: absolute; inset: 0; z-index: 0; }
  /* darker surroundings: a soft dark ring that blends the scene into the page colour */
  .vignette { position: absolute; inset: 0; z-index: 1; pointer-events: none;
    box-shadow: inset 0 0 70px 30px #111216; }   /* edges fade into the page colour */
  /* GET STARTED: always above the 3D scene (z-index 3), white text in a thin white box */
  .cta { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 3;
    font-family: 'Josefin Sans', Arial, sans-serif; font-weight: 400; letter-spacing: .5em; font-size: 15px;
    padding: 15px 24px 13px 32px; border: 1px solid #ffffff; color: #ffffff; white-space: nowrap;
    background: rgba(8,9,11,.72); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    cursor: pointer; animation: pulse 2.5s ease-in-out infinite; transition: opacity .4s; }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  .cta.gone { animation: none; opacity: 0; }
  .fallback { display: none; position: absolute; inset: 0; z-index: 2; align-items: center; justify-content: center; flex-direction: column; gap: 30px; }
  .fallback svg { width: min(56vh, 70vw); transform: perspective(900px) rotateX(48deg) rotateZ(-24deg); }
  .fallback .cta { position: static; transform: none; animation: none; opacity: 1; }
  @media (max-width: 520px) { .cta { font-size: 12px; letter-spacing: .35em; padding: 12px 16px 10px 20px; } .top svg { height: 60px; } }
  @media (prefers-reduced-motion: reduce) { .cta { animation: none; opacity: 1; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    {{LOGO}}
    <div class="title">Predict the winner</div>
    <div class="tag">See the end from the opening.</div>
  </div>
  <div class="stage" id="stage">
    <div class="vignette"></div>
    <div class="cta" id="cta">GET STARTED</div>
    <div class="fallback" id="fallback"></div>
  </div>
</div>

<script>
// ---------- open the PREDICT page ----------
function goPredict() {
  try {   // click the PREDICT button of the top menu (keeps the same app session)
    const b = window.parent.document.querySelector('.st-key-nav_predict button');
    if (b) { b.click(); return; }
  } catch (e) {}
  try { window.top.location.search = '?page=predict'; } catch (e) { window.open('?page=predict', '_top'); }
}

// ---------- fallback: flat board picture + button (no 3D) ----------
function showFallback() {
  if (window.__fallback) return;
  window.__fallback = true;
  const st = document.getElementById('stage');
  st.querySelectorAll('canvas').forEach(c => c.remove());
  document.getElementById('cta').style.display = 'none';
  let sq = '';
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++)
    sq += `<rect x="${10 + f * 10}" y="${10 + r * 10}" width="10" height="10" fill="${(r + f) % 2 ? '#050505' : '#f4f4f4'}"/>`;
  const fb = document.getElementById('fallback');
  fb.innerHTML = `<svg viewBox="0 0 100 100"><rect x="2" y="2" width="96" height="96" fill="#070708" stroke="#c9ccd1" stroke-width=".6"/>${sq}</svg>
                  <div class="cta" onclick="goPredict()">GET STARTED</div>`;
  fb.style.display = 'flex';
}

function hasWebGL() {
  try { const c = document.createElement('canvas');
        return !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl'))); }
  catch (e) { return false; }
}

if (!hasWebGL()) showFallback();
else {
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
  s.onload = () => { try { init(); } catch (e) { console.error(e); showFallback(); } };
  s.onerror = showFallback;
  document.head.appendChild(s);
  setTimeout(() => { if (!window.THREE) showFallback(); }, 9000);
}

// ---------- the 3D scene ----------
function init() {
  const stage = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ antialias: true, stencil: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x0e0f12, 1);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.prepend(renderer.domElement);

  const scene = new THREE.Scene();

  // a painted "studio": dark walls with soft light boxes -> glossy highlights on pieces and frame
  const ec = document.createElement('canvas'); ec.width = 1024; ec.height = 512;
  const g = ec.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 512);
  grad.addColorStop(0, '#2a2b30'); grad.addColorStop(.5, '#0e0f12'); grad.addColorStop(1, '#050506');
  g.fillStyle = grad; g.fillRect(0, 0, 1024, 512);
  function softbox(x, y, rx, ry, a) {
    g.save(); g.translate(x, y); g.scale(1, ry / rx);
    const rg = g.createRadialGradient(0, 0, 0, 0, 0, rx);
    rg.addColorStop(0, `rgba(255,255,255,${a})`); rg.addColorStop(.5, `rgba(255,255,255,${a * .6})`); rg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = rg; g.beginPath(); g.arc(0, 0, rx, 0, Math.PI * 2); g.fill(); g.restore();
  }
  softbox(230, 80, 150, 50, 1); softbox(690, 100, 200, 40, .8); softbox(940, 220, 60, 120, .5); softbox(470, 60, 60, 25, .9);
  const envTex = new THREE.CanvasTexture(ec);
  envTex.mapping = THREE.EquirectangularReflectionMapping; envTex.encoding = THREE.sRGBEncoding;
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromEquirectangular(envTex).texture;

  // lights: soft key light with shadows, a rim light from behind, a gentle fill
  const key = new THREE.DirectionalLight(0xffffff, 1.6);
  key.position.set(-7, 12, -6); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  Object.assign(key.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 40 });
  key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
  scene.add(key);
  // (placed low behind, so its mirror image on the flat frame does not shine into the camera)
  const rim = new THREE.DirectionalLight(0xffffff, 0.9); rim.position.set(2, 3, -10); scene.add(rim);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x000000, 0.55));

  // materials (colours given in normal screen colours, converted for three.js)
  const C = (hex) => new THREE.Color(hex).convertSRGBToLinear();
  const P = (o) => { o.color = C(o.color); return new THREE.MeshPhysicalMaterial(o); };
  const matWhite  = P({ color: 0xf6f6f6, roughness: .16, clearcoat: 1, clearcoatRoughness: .05 });
  const matBlack  = P({ color: 0x060606, roughness: .14, clearcoat: 1, clearcoatRoughness: .03, envMapIntensity: 1.4 });
  const matFrame  = new THREE.MeshStandardMaterial({ color: C(0x050506), roughness: .3, metalness: 0, envMapIntensity: .06 });
  const matSilver = P({ color: 0xd4d7dc, metalness: 1, roughness: .18 });
  const slitOnWhite = P({ color: 0x1c1c1e, roughness: .4 });
  const slitOnBlack = P({ color: 0x3a3b40, roughness: .3, metalness: .2 });
  // squares: pure flat white / black (no tone mapping -> crisp, no grey gradient); a little see-through,
  // so the mirror copy of the pieces underneath shows as a soft reflection
  // (MeshBasicMaterial = not affected by light, so every white square is the same pure white)
  const matSqW = new THREE.MeshBasicMaterial({ color: C(0xffffff), transparent: true, opacity: .92, toneMapped: false });
  const matSqB = new THREE.MeshBasicMaterial({ color: C(0x000000), transparent: true, opacity: .8, toneMapped: false });

  // ---------- pieces: smooth hourglass shapes (a side profile spun around = lathe) ----------
  const V = (r, y) => new THREE.Vector2(r, y);
  function lathe(points, segs) {
    const smooth = new THREE.SplineCurve(points).getPoints(segs || 80);
    const geo = new THREE.LatheGeometry(smooth, 64); geo.computeVertexNormals(); return geo;
  }
  // hourglass body: wide foot, thin waist, flared collar at height h
  const hourglass = (h, foot, waist, collar) => lathe([
    V(0, 0), V(foot, 0), V(foot, .03), V(foot * .86, .07), V(waist * 1.25, h * .32), V(waist, h * .55),
    V(collar * .85, h * .9), V(collar, h - .015), V(collar * .9, h), V(0, h + .005)]);
  const sphere = (r, y) => new THREE.SphereGeometry(r, 40, 24).translate(0, y, 0);

  const geos = {};
  // pawn: small hourglass + ball
  geos.p = [[hourglass(.4, .3, .085, .17), sphere(.13, .5)], []];
  // rook: hourglass + drum with a notched top (4 small blocks)
  {
    const parts = [hourglass(.48, .33, .11, .22), new THREE.CylinderGeometry(.21, .22, .2, 48).translate(0, .58, 0)];
    for (let i = 0; i < 4; i++) {
      const a = i * Math.PI / 2 + Math.PI / 4;
      parts.push(new THREE.BoxGeometry(.11, .08, .11).rotateY(-a).translate(.145 * Math.cos(a), .72, .145 * Math.sin(a)));
    }
    geos.r = [parts, []];
  }
  // bishop: hourglass + egg-shaped top with a slanted slit + tiny ball
  geos.b = [[hourglass(.56, .32, .09, .17),
             lathe([V(0, .53), V(.11, .56), V(.15, .66), V(.13, .78), V(.06, .87), V(0, .885)], 40),
             sphere(.04, .92)],
            [new THREE.BoxGeometry(.025, .2, .3).rotateX(.62).translate(0, .73, 0)]];   // slit
  // knight: hourglass + one smooth curved arc as an abstract head, facing the other side
  {
    const R = .17, tube = .085, A = Math.PI * .95;
    const arc = new THREE.TorusGeometry(R, tube, 24, 48, A).translate(-R, .5, 0);   // starts at (0,.5), arches toward -x
    const endX = -R + R * Math.cos(A), endY = .5 + R * Math.sin(A);
    geos.n = [[hourglass(.5, .33, .1, .17), arc, sphere(tube, .5), sphere(tube, endY).translate(endX, 0, 0)], []];
  }
  // queen: taller hourglass + small crown ring + ball
  geos.q = [[hourglass(.78, .35, .1, .19),
             lathe([V(0, .77), V(.15, .79), V(.11, .86), V(.07, .9), V(0, .91)], 30),
             new THREE.TorusGeometry(.105, .022, 16, 48).rotateX(Math.PI / 2).translate(0, .93, 0),
             sphere(.06, 1.0)], []];
  // king: tallest hourglass + flat cap + small cross
  geos.k = [[hourglass(.88, .36, .105, .2),
             lathe([V(0, .87), V(.16, .89), V(.13, .97), V(0, .99)], 30),
             new THREE.BoxGeometry(.05, .22, .05).translate(0, 1.09, 0),
             new THREE.BoxGeometry(.16, .05, .05).translate(0, 1.11, 0)], []];

  // reflection materials: same look, but only drawn where the board top was drawn (stencil = 1)
  const reflCache = new Map();
  function reflMat(m) {
    if (!reflCache.has(m)) {
      const r = m.clone();
      Object.assign(r, { stencilWrite: true, stencilRef: 1, stencilFunc: THREE.EqualStencilFunc,
                         stencilFail: THREE.KeepStencilOp, stencilZFail: THREE.KeepStencilOp, stencilZPass: THREE.KeepStencilOp });
      reflCache.set(m, r);
    }
    return reflCache.get(m);
  }
  // one chess piece. mirror=true -> upside-down copy used as the reflection (drawn only inside the board)
  function piece(type, white, x, z, mirror) {
    const grp = new THREE.Group();
    const [body, accents] = geos[type];
    const bodyMat = white ? matWhite : matBlack;
    const accMat = white ? slitOnWhite : slitOnBlack;
    body.forEach(geo => grp.add(new THREE.Mesh(geo, mirror ? reflMat(bodyMat) : bodyMat)));
    accents.forEach(geo => grp.add(new THREE.Mesh(geo, mirror ? reflMat(accMat) : accMat)));
    grp.traverse(o => { if (!o.isMesh) return;
                        if (mirror) o.renderOrder = -1; else { o.castShadow = true; o.receiveShadow = true; } });
    grp.position.set(x, 0, z);
    if (type === 'n') grp.rotation.y = white ? -Math.PI / 2 : Math.PI / 2;   // the head faces the other side
    if (type === 'b') grp.rotation.y = white ? 0 : Math.PI;
    return grp;
  }

  // ---------- board ----------
  const turn = new THREE.Group(); scene.add(turn);          // everything that turns on click

  // 1) invisible "mask" of the playing area: marks the screen pixels where the board top is (stencil = 1)
  const mask = new THREE.Mesh(new THREE.PlaneGeometry(8, 8).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: false, stencilWrite: true, stencilRef: 1,
      stencilFunc: THREE.AlwaysStencilFunc, stencilZPass: THREE.ReplaceStencilOp }));
  mask.renderOrder = -2; turn.add(mask);

  // 2) 64 squares, flat, slightly see-through
  const sqGeo = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);
  for (let f = 0; f < 8; f++) for (let r = 0; r < 8; r++) {
    const m = new THREE.Mesh(sqGeo, (f + r) % 2 ? matSqW : matSqB);
    m.position.set(f - 3.5, 0, r - 3.5); turn.add(m);
  }
  // soft shadows of the pieces: a see-through layer that only shows shadows
  const shadowLayer = new THREE.Mesh(new THREE.PlaneGeometry(8, 8).rotateX(-Math.PI / 2),
    new THREE.ShadowMaterial({ opacity: .32, depthWrite: false }));
  shadowLayer.position.y = .002; shadowLayer.receiveShadow = true; shadowLayer.renderOrder = 1; turn.add(shadowLayer);

  // 3) black glossy frame (a square ring) + thin silver lines on the outer edge and around the squares
  function ring(outer, inner, h, mat, top) {
    const sh = new THREE.Shape(); sh.moveTo(-outer, -outer); sh.lineTo(outer, -outer); sh.lineTo(outer, outer); sh.lineTo(-outer, outer); sh.closePath();
    const hole = new THREE.Path(); hole.moveTo(-inner, -inner); hole.lineTo(-inner, inner); hole.lineTo(inner, inner); hole.lineTo(inner, -inner); hole.closePath();
    sh.holes.push(hole);
    const geo = new THREE.ExtrudeGeometry(sh, { depth: h, bevelEnabled: true, bevelThickness: .012, bevelSize: .012, bevelSegments: 3 });
    geo.rotateX(-Math.PI / 2); geo.translate(0, top - h, 0);
    const m = new THREE.Mesh(geo, mat); m.receiveShadow = true; return m;
  }
  turn.add(ring(4.62, 4.04, .42, matFrame, .035));     // black frame (its sides are the board's thickness)
  turn.add(ring(4.69, 4.635, .44, matSilver, .045));   // thin silver outer edge
  turn.add(ring(4.04, 4.0, .05, matSilver, .02));      // thin silver line around the squares

  // 4) pieces + their mirror copies (the reflection)
  const back = ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'];
  const refl = new THREE.Group(); refl.scale.y = -1; turn.add(refl);
  for (let f = 0; f < 8; f++) {
    const x = f - 3.5;
    [[back[f], true, 3.5], ['p', true, 2.5], [back[f], false, -3.5], ['p', false, -2.5]].forEach(([t, w, z]) => {
      turn.add(piece(t, w, x, z, false));
      refl.add(piece(t, w, x, z, true));
    });
  }

  // 5) dark floor (not drawn over the board area, so it never hides the reflection)
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ color: C(0x0e0f12), toneMapped: false, stencilWrite: true, stencilRef: 1,
      stencilFunc: THREE.NotEqualStencilFunc, stencilZPass: THREE.KeepStencilOp }));
  floor.position.y = -.39; scene.add(floor);

  // camera: in front of White, a little to the left, fairly low angle
  const camera = new THREE.PerspectiveCamera(27, 1, .1, 120);
  const target = new THREE.Vector3(0, -.55, .55);
  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false); renderer.domElement.style.width = w + 'px'; renderer.domElement.style.height = h + 'px';
    camera.aspect = w / h;
    const k = Math.max(1, 1.55 / camera.aspect);             // step back on narrow screens
    camera.position.set(-8.3 * k, 7.2 * k, 13.6 * k); camera.lookAt(target);
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage); resize();

  // animation: very slow idle sway; on click the board turns, then the PREDICT page opens
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clock = new THREE.Clock();
  let spin = null;
  const ease = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  function start() {
    if (spin) return;
    document.getElementById('cta').classList.add('gone');
    spin = { t0: clock.getElapsedTime(), from: turn.rotation.y, dur: reduce ? .2 : 1.3 };
  }
  stage.addEventListener('click', start);
  document.getElementById('cta').addEventListener('click', (e) => { e.stopPropagation(); start(); });

  (function loop() {
    const t = clock.getElapsedTime();
    if (spin) {
      const p = Math.min(1, (t - spin.t0) / spin.dur);
      turn.rotation.y = spin.from + ease(p) * Math.PI / 2;
      if (p >= 1 && !spin.done) { spin.done = true; goPredict(); }
    } else if (!reduce) {
      turn.rotation.y = Math.sin(t * .22) * .06;
    }
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  })();
}
</script>
</body>
</html>
