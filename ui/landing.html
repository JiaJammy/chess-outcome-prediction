<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Landing page of app_new.py. A 3D chessboard made from scratch with three.js.
     {{LOGO}} is replaced by the queen-and-king SVG from src/ui_parts.py. -->
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@200;300&family=Source+Sans+3:wght@300&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #111216; color: #f5f5f5; overflow: hidden;
    font-family: 'Source Sans 3', 'Segoe UI', Arial, sans-serif; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; }
  .top { text-align: center; padding-top: 22px; }
  .top svg { height: 78px; }
  .title { display: flex; align-items: center; justify-content: center; gap: 22px; margin-top: 16px;
    font-family: 'Josefin Sans', 'Montserrat', Arial, sans-serif; font-weight: 200; letter-spacing: .34em;
    font-size: clamp(20px, 3.3vw, 40px); text-transform: uppercase; padding-left: .34em; white-space: nowrap; }
  .title:before, .title:after { content: ""; width: clamp(26px, 8vw, 120px); height: 1px; background: rgba(245,245,245,.75); }
  .tag { margin-top: 12px; font-size: 11px; letter-spacing: .45em; color: #8a8a8a; text-transform: uppercase;
    font-family: 'Josefin Sans', Arial, sans-serif; padding-left: .45em; }
  .stage { position: relative; flex: 1; width: 100%; min-height: 280px; cursor: pointer; margin-top: 14px; }
  .stage canvas { display: block; position: absolute; inset: 0; }
  .cta { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font-family: 'Josefin Sans', Arial, sans-serif; font-weight: 300; letter-spacing: .5em; font-size: 15px;
    padding: 15px 26px 13px 34px; border: 1px solid rgba(245,245,245,.85); background: rgba(17,18,22,.38);
    color: #f5f5f5; cursor: pointer; animation: pulse 2.5s ease-in-out infinite; transition: opacity .4s; white-space: nowrap; }
  @media (max-width: 520px) { .cta { font-size: 12px; letter-spacing: .35em; padding: 12px 16px 10px 20px; } .top svg { height: 60px; } }
  @keyframes pulse { 0%, 100% { opacity: .22; } 50% { opacity: 1; } }
  .cta.gone { animation: none; opacity: 0; }
  .fallback { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; flex-direction: column; gap: 30px; }
  .fallback svg { width: min(56vh, 70vw); transform: perspective(900px) rotateX(48deg) rotateZ(-24deg); }
  .fallback .cta { position: static; transform: none; animation: none; }
  @media (prefers-reduced-motion: reduce) { .cta { animation: none; opacity: 1; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    {{LOGO}}
    <div class="title">Predict the winner</div>
    <div class="tag">See the end from the opening.</div>
  </div>
  <div class="stage" id="stage">
    <div class="cta" id="cta">GET STARTED</div>
    <div class="fallback" id="fallback"></div>
  </div>
</div>

<script>
// ---------- open the PREDICT page ----------
function goPredict() {
  try {   // click the PREDICT button of the top menu (keeps the same app session)
    const b = window.parent.document.querySelector('.st-key-nav_predict button');
    if (b) { b.click(); return; }
  } catch (e) {}
  try { window.top.location.search = '?page=predict'; } catch (e) { window.open('?page=predict', '_top'); }
}

// ---------- fallback: flat board picture + button (no 3D) ----------
function showFallback() {
  if (window.__fallback) return;
  window.__fallback = true;
  const st = document.getElementById('stage');
  st.querySelectorAll('canvas').forEach(c => c.remove());
  document.getElementById('cta').style.display = 'none';
  let sq = '';
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++)
    sq += `<rect x="${10 + f * 10}" y="${10 + r * 10}" width="10" height="10" fill="${(r + f) % 2 ? '#0c0c0e' : '#e9e9e9'}"/>`;
  const fb = document.getElementById('fallback');
  fb.innerHTML = `<svg viewBox="0 0 100 100"><rect x="2" y="2" width="96" height="96" fill="#f2f2f2" stroke="#b8bcc2" stroke-width=".8"/>${sq}</svg>
                  <div class="cta" onclick="goPredict()">GET STARTED</div>`;
  fb.style.display = 'flex';
}

function hasWebGL() {
  try { const c = document.createElement('canvas');
        return !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl'))); }
  catch (e) { return false; }
}

if (!hasWebGL()) showFallback();
else {
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
  s.onload = () => { try { init(); } catch (e) { console.error(e); showFallback(); } };
  s.onerror = showFallback;
  document.head.appendChild(s);
  setTimeout(() => { if (!window.THREE) showFallback(); }, 9000);
}

// ---------- the 3D scene ----------
function init() {
  const stage = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x111216, 1);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.prepend(renderer.domElement);

  const scene = new THREE.Scene();

  // soft "studio" made from a painted picture: dark walls + three soft light boxes (gives glossy reflections)
  const ec = document.createElement('canvas'); ec.width = 1024; ec.height = 512;
  const g = ec.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 512);
  grad.addColorStop(0, '#34353a'); grad.addColorStop(.5, '#141519'); grad.addColorStop(1, '#09090b');
  g.fillStyle = grad; g.fillRect(0, 0, 1024, 512);
  function softbox(x, y, rx, ry, a) {
    g.save(); g.translate(x, y); g.scale(1, ry / rx);
    const rg = g.createRadialGradient(0, 0, 0, 0, 0, rx);
    rg.addColorStop(0, `rgba(255,255,255,${a})`); rg.addColorStop(.55, `rgba(255,255,255,${a * .55})`); rg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = rg; g.beginPath(); g.arc(0, 0, rx, 0, Math.PI * 2); g.fill(); g.restore();
  }
  softbox(250, 70, 170, 55, .8); softbox(700, 95, 210, 45, .55); softbox(930, 230, 70, 110, .35);
  const envTex = new THREE.CanvasTexture(ec);
  envTex.mapping = THREE.EquirectangularReflectionMapping; envTex.encoding = THREE.sRGBEncoding;
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromEquirectangular(envTex).texture;

  // lights: one soft key light with shadows, a rim light behind, and a gentle fill
  const key = new THREE.DirectionalLight(0xffffff, 1.5);
  key.position.set(-9, 12, -3); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  Object.assign(key.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: 1, far: 40 });
  key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xffffff, 0.9); rim.position.set(5, 7, -9); scene.add(rim);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x0a0a0a, 0.35));

  // materials
  const M = (o) => { o.color = new THREE.Color(o.color).convertSRGBToLinear(); return new THREE.MeshPhysicalMaterial(o); };
  const matLightSq = M({ color: 0xe0e0e0, roughness: .35, clearcoat: .45, clearcoatRoughness: .3 });
  const matDarkSq  = M({ color: 0x0b0b0d, roughness: .25, clearcoat: 1, clearcoatRoughness: .12 });
  const matFrame   = M({ color: 0xf2f2f2, roughness: .3, clearcoat: .8, clearcoatRoughness: .15 });
  const matSilver  = M({ color: 0xc9ccd1, metalness: 1, roughness: .22 });
  const matWhite   = M({ color: 0xf1f1f1, roughness: .26, clearcoat: .8, clearcoatRoughness: .1 });
  const matBlack   = M({ color: 0x141416, roughness: .2, clearcoat: 1, clearcoatRoughness: .06 });

  // ---------- pieces: smooth shapes made by spinning a side profile (lathe) ----------
  const V = (r, y) => new THREE.Vector2(r, y);
  function arc(cy, rx, ry, a0, a1, n) {
    const p = []; for (let i = 0; i <= n; i++) { const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180;
      p.push(V(Math.max(0.0001, rx * Math.cos(a)), cy + ry * Math.sin(a))); } return p;
  }
  const base = (w) => [V(0, 0), V(.34 * w, 0), V(.355 * w, .03), V(.345 * w, .07), V(.29 * w, .11), V(.22 * w, .15)];
  function lathe(points) {
    const smooth = new THREE.SplineCurve(points).getPoints(90);
    const geo = new THREE.LatheGeometry(smooth, 56); geo.computeVertexNormals(); return geo;
  }
  const geos = {
    p: [lathe([...base(.95), V(.15, .24), V(.11, .36), V(.17, .4), V(.17, .43), V(.1, .46), ...arc(.57, .135, .135, -55, 90, 8)])],
    r: [lathe([...base(1), V(.17, .28), V(.15, .5), V(.21, .56), V(.23, .6), V(.23, .76), V(.19, .78), V(.18, .73), V(0, .72)])],
    b: [lathe([...base(1), V(.16, .28), V(.105, .52), V(.18, .57), V(.18, .6), V(.1, .63), ...arc(.8, .145, .2, -60, 90, 10)]),
        new THREE.SphereGeometry(.05, 24, 16).translate(0, 1.04, 0)],
    q: [lathe([...base(1.06), V(.18, .3), V(.12, .62), V(.21, .68), V(.21, .71), V(.13, .74), V(.2, .92), V(.205, .95), V(.12, .965), V(0, .97)]),
        new THREE.SphereGeometry(.075, 24, 16).translate(0, 1.04, 0)],
    k: [lathe([...base(1.08), V(.18, .3), V(.12, .68), V(.21, .74), V(.21, .77), V(.13, .8), V(.19, 1.0), V(.19, 1.03), V(0, 1.04)]),
        new THREE.BoxGeometry(.06, .26, .06).translate(0, 1.17, 0), new THREE.BoxGeometry(.18, .06, .06).translate(0, 1.19, 0)],
  };
  // knight: same kind of base + a simple, rounded horse-head shape
  const hs = new THREE.Shape();
  [[-.15, 0], [.13, 0], [.11, .13], [.27, .25], [.27, .34], [.09, .46], [-.02, .52], [-.07, .45], [-.16, .3]]
    .forEach((p, i) => i ? hs.lineTo(p[0], p[1]) : hs.moveTo(p[0], p[1]));
  const head = new THREE.ExtrudeGeometry(hs, { depth: .16, bevelEnabled: true, bevelThickness: .04, bevelSize: .035, bevelSegments: 4, curveSegments: 8 });
  head.translate(0, .44, -.08);
  geos.n = [lathe([...base(1), V(.17, .27), V(.15, .4), V(.21, .45), V(.2, .48), V(0, .49)]), head];

  function piece(type, white, x, z) {
    const grp = new THREE.Group();
    geos[type].forEach(geo => { const m = new THREE.Mesh(geo, white ? matWhite : matBlack); m.castShadow = true; m.receiveShadow = true; grp.add(m); });
    grp.position.set(x, 0, z);
    grp.scale.setScalar(.92);
    if (type === 'n') grp.rotation.y = white ? Math.PI / 2 : -Math.PI / 2;   // knights face the other side
    return grp;
  }

  // ---------- board: 64 glossy squares, white frame, thin silver edge ----------
  function buildSet(withShadows) {
    const set = new THREE.Group();
    const sqGeo = new THREE.BoxGeometry(1, .1, 1);
    for (let f = 0; f < 8; f++) for (let r = 0; r < 8; r++) {
      const m = new THREE.Mesh(sqGeo, (f + r) % 2 ? matLightSq : matDarkSq);
      m.position.set(f - 3.5, -.05, r - 3.5); m.receiveShadow = withShadows; set.add(m);
    }
    function ring(outer, inner, h, mat, top) {
      const sh = new THREE.Shape(); sh.moveTo(-outer, -outer); sh.lineTo(outer, -outer); sh.lineTo(outer, outer); sh.lineTo(-outer, outer); sh.closePath();
      const hole = new THREE.Path(); hole.moveTo(-inner, -inner); hole.lineTo(-inner, inner); hole.lineTo(inner, inner); hole.lineTo(inner, -inner); hole.closePath();
      sh.holes.push(hole);
      const geo = new THREE.ExtrudeGeometry(sh, { depth: h, bevelEnabled: true, bevelThickness: .015, bevelSize: .015, bevelSegments: 2 });
      geo.rotateX(-Math.PI / 2); geo.translate(0, top - h, 0);
      const m = new THREE.Mesh(geo, mat); m.receiveShadow = withShadows; m.castShadow = withShadows; return m;
    }
    set.add(ring(4.72, 4.0, .46, matFrame, .05));     // white frame
    set.add(ring(4.78, 4.72, .48, matSilver, .055));  // thin silver edge
    const under = new THREE.Mesh(new THREE.BoxGeometry(8, .3, 8), matDarkSq); under.position.y = -.25; set.add(under);
    const back = ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'];
    for (let f = 0; f < 8; f++) {
      const x = f - 3.5;
      set.add(piece(back[f], true, x, 3.5));  set.add(piece('p', true, x, 2.5));     // White at the front
      set.add(piece(back[f], false, x, -3.5)); set.add(piece('p', false, x, -2.5));  // Black at the back
    }
    if (!withShadows) set.traverse(o => { o.castShadow = false; o.receiveShadow = false; });
    return set;
  }

  const FLOOR = -.43;
  const turn = new THREE.Group(); scene.add(turn);         // everything that turns
  const real = buildSet(true); turn.add(real);
  const refl = buildSet(false);                              // upside-down copy under a see-through floor = soft reflection
  refl.scale.y = -1; refl.position.y = 2 * FLOOR; turn.add(refl);

  // floor: same colour as the page, a little see-through in the middle so the reflection shows softly
  const fc = document.createElement('canvas'); fc.width = fc.height = 256;
  const fg = fc.getContext('2d');
  const frg = fg.createRadialGradient(128, 128, 10, 128, 128, 128);
  frg.addColorStop(0, 'rgba(17,18,22,.78)'); frg.addColorStop(.08, 'rgba(17,18,22,.86)'); frg.addColorStop(.2,  'rgba(17,18,22,1)'); frg.addColorStop(1, 'rgba(17,18,22,1)');
  fg.fillStyle = frg; fg.fillRect(0, 0, 256, 256);
  const floorTex = new THREE.CanvasTexture(fc); floorTex.encoding = THREE.sRGBEncoding;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200),
    new THREE.MeshBasicMaterial({ map: floorTex, transparent: true, toneMapped: false, depthWrite: false }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = FLOOR; floor.renderOrder = 1;
  scene.add(floor);

  // camera: in front of White, a little to the left, looking down at an angle
  const camera = new THREE.PerspectiveCamera(30, 1, .1, 120);
  const target = new THREE.Vector3(0, -.6, .5);
  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false); renderer.domElement.style.width = w + 'px'; renderer.domElement.style.height = h + 'px';
    camera.aspect = w / h;
    const k = Math.max(1.1, 1.45 / camera.aspect);           // step back on narrow screens
    camera.position.set(-8.2 * k, 9.4 * k, 12.2 * k); camera.lookAt(target);
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage); resize();

  // animation: very slow idle sway; on click the board turns, then the PREDICT page opens
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clock = new THREE.Clock();
  let spin = null;
  const ease = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  function start() {
    if (spin) return;
    document.getElementById('cta').classList.add('gone');
    spin = { t0: clock.getElapsedTime(), from: turn.rotation.y, dur: reduce ? .2 : 1.3 };
  }
  stage.addEventListener('click', start);
  document.getElementById('cta').addEventListener('click', (e) => { e.stopPropagation(); start(); });

  (function loop() {
    const t = clock.getElapsedTime();
    if (spin) {
      const p = Math.min(1, (t - spin.t0) / spin.dur);
      turn.rotation.y = spin.from + ease(p) * Math.PI / 2;
      if (p >= 1 && !spin.done) { spin.done = true; goPredict(); }
    } else if (!reduce) {
      turn.rotation.y = Math.sin(t * .22) * .06;
    }
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  })();
}
</script>
</body>
</html>
